<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>우리 반 디지털 미술관</title>
  <style>
    :root { --glass: rgba(20,20,20,.68); --border: rgba(255,255,255,.22); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; user-select:none; overscroll-behavior:none; }
    button,input { font:inherit; }
    #app { position:fixed; inset:0; background:#111; }
    #stage { position:absolute; inset:0; overflow:hidden; touch-action:none; background:#111 center/contain no-repeat; }
    #stage::before { content:""; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.08)); pointer-events:none; }
    #emptyState { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:#fff; text-align:center; padding:40px; }
    #emptyCard { background:rgba(0,0,0,.55); border:1px solid var(--border); backdrop-filter:blur(12px); padding:28px 32px; border-radius:24px; max-width:560px; }
    #emptyCard h1 { margin:0 0 10px; font-size:clamp(28px,4vw,52px); }
    #emptyCard p { margin:0; opacity:.85; line-height:1.6; font-size:clamp(15px,2vw,20px); }
    #artLayer { position:absolute; inset:0; }
    .art { position:absolute; transform-origin:center; touch-action:none; cursor:grab; }
    .art img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
    .art .motion { width:100%; height:100%; transform-origin:center; }
    .art.motion-sway .motion { animation:sway 9s ease-in-out infinite alternate; }
    .art.motion-drift .motion { animation:drift 14s ease-in-out infinite alternate; }
    .art.motion-fall .motion { animation:fall 18s ease-in-out infinite alternate; }
    body.editing .motion, .art.selected .motion { animation-play-state:paused !important; }
    @keyframes sway { from{transform:rotate(-4deg)} to{transform:rotate(4deg)} }
    @keyframes drift { from{transform:translateX(-12px)} to{transform:translateX(12px)} }
    @keyframes fall { from{transform:translateY(-9px)} to{transform:translateY(9px)} }
    @media (prefers-reduced-motion:reduce){ .motion { animation:none !important; } }
    .art.selected { outline:3px solid rgba(255,255,255,.95); outline-offset:4px; border-radius:8px; }
    .art.enter .motion { animation:popIn .6s ease both; }
    @keyframes popIn { from{opacity:0; scale:.82} to{opacity:1; scale:1} }
    #toolbar { position:absolute; right:max(18px, env(safe-area-inset-right)); bottom:max(18px, env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:20; transition:.25s; }
    #toolbar.hidden { opacity:0; pointer-events:none; transform:translateY(10px); }
    .btn { border:1px solid var(--border); background:var(--glass); color:#fff; padding:14px 18px; border-radius:16px; min-height:52px; backdrop-filter:blur(14px); display:inline-flex; align-items:center; gap:8px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.22); }
    .btn.primary { background:rgba(255,255,255,.94); color:#111; border-color:rgba(255,255,255,.8); }
    .btn.danger { background:rgba(145,25,25,.85); }
    #editPanel { position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; gap:8px; z-index:25; background:var(--glass); border:1px solid var(--border); border-radius:18px; padding:8px; backdrop-filter:blur(14px); }
    #editPanel.show { display:flex; flex-wrap:wrap; max-width:95vw; justify-content:center; }
    .iconBtn { border:0; background:rgba(255,255,255,.12); color:#fff; border-radius:12px; padding:10px 13px; min-width:48px; min-height:44px; font-weight:800; }
    .modal { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); padding:max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
    .modal.show { display:flex; }
    .panel { width:min(980px,100%); max-height:94vh; overflow:auto; background:#f5f5f3; color:#111; border-radius:24px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.45); }
    .panel h2 { margin:0 0 8px; font-size:26px; }
    .panel p { margin:4px 0 14px; color:#555; line-height:1.5; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1 1 180px; }
    .choice { padding:18px; border:1px solid #ddd; border-radius:18px; background:white; text-align:center; font-weight:800; min-height:92px; }
    .choice input { display:none; }
    .previewGrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; }
    .previewBox { min-height:300px; background:#ddd; border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative; }
    .previewBox.checker { background-color:#fff; background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    .previewBox img,.previewBox canvas { max-width:100%; max-height:58vh; object-fit:contain; }
    .rangeWrap { background:#fff; padding:14px; border-radius:16px; border:1px solid #ddd; }
    input[type=range] { width:100%; }
    .modalActions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
    .modalActions button { flex:0 0 auto; }
    #settingsPanel label { display:block; font-weight:700; margin:14px 0 6px; }
    .mini { font-size:13px; color:#666; }
    #toast { position:fixed; left:50%; top:max(18px, env(safe-area-inset-top)); transform:translateX(-50%) translateY(-10px); background:rgba(0,0,0,.82); color:white; padding:11px 16px; border-radius:999px; z-index:200; opacity:0; pointer-events:none; transition:.25s; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #exitExhibit { position:absolute; left:10px; top:10px; width:34px; height:34px; border:0; border-radius:50%; opacity:.12; z-index:40; display:none; }
    body.exhibit #exitExhibit { display:block; }
    body.exhibit #toolbar, body.exhibit #editPanel { display:none !important; }
    @media (max-width:760px){ .previewGrid{grid-template-columns:1fr} .previewBox{min-height:220px} .btn{padding:12px 14px; min-height:48px} #toolbar{left:12px;right:12px;justify-content:flex-end;flex-wrap:wrap} }
  </style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="emptyState"><div id="emptyCard"><h1>우리 반 디지털 미술관</h1><p>먼저 <b>배경 설정</b>에서 미술 작품을 선택한 뒤, 학생 작품을 촬영해 작품 속에 넣어보세요.</p></div></div>
    <div id="artLayer"></div>
    <button id="exitExhibit" aria-label="전시 모드 종료"></button>
  </div>
  <div id="toolbar">
    <button class="btn" id="bgBtn">🖼️ 배경 설정</button>
    <button class="btn" id="manageBtn">✏️ 작품 정리</button>
    <button class="btn" id="exhibitBtn">⛶ 전시 화면</button>
    <button class="btn primary" id="addBtn">📷 작품 추가</button>
  </div>
  <div id="editPanel">
    <button class="iconBtn" data-act="smaller">−</button>
    <button class="iconBtn" data-act="bigger">＋</button>
    <button class="iconBtn" data-act="rotateL">↺</button>
    <button class="iconBtn" data-act="rotateR">↻</button>
    <button class="iconBtn" data-act="front">앞</button>
    <button class="iconBtn" data-act="back">뒤</button>
    <select id="selectedMotion" aria-label="선택한 작품 움직임"><option value="fixed">고정</option><option value="sway">흔들기</option><option value="drift">천천히 이동</option><option value="fall">떨어지기</option></select>
    <button class="iconBtn" data-act="delete">🗑</button>
    <button class="iconBtn" data-act="done">완료</button>
  </div>
</div>

<div class="modal" id="addModal"><div class="panel">
  <h2>학생 작품 추가</h2><p>흰 종이 위의 그림이나 글씨를 촬영하거나 사진에서 선택하세요.</p>
  <div class="row">
    <label class="choice">📷<br>카메라로 촬영<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
    <label class="choice">🖼️<br>사진에서 선택<input id="photoInput" type="file" accept="image/*"></label>
  </div>
  <div class="modalActions"><button class="btn" id="cancelAdd">취소</button></div>
</div></div>

<div class="modal" id="processModal"><div class="panel">
  <h2>배경 제거 확인</h2><p>오른쪽 결과를 확인하고 필요하면 배경 제거 강도를 조절하세요.</p>
  <div class="previewGrid">
    <div class="previewBox"><img id="originalPreview" alt="원본"></div>
    <div class="previewBox checker"><canvas id="processedCanvas"></canvas></div>
  </div>
  <div class="rangeWrap"><b>배경 제거 강도</b><div class="mini">값이 높을수록 더 많은 밝은 종이 영역을 지웁니다.</div><input id="threshold" type="range" min="20" max="115" value="70"><div class="mini">현재 강도: <span id="thresholdValue">70</span></div></div>
  <label class="rangeWrap" style="display:block;margin-top:10px"><b>작품 움직임</b><select id="newMotion" style="display:block;width:100%;padding:12px;margin-top:8px"><option value="fixed">고정</option><option value="sway">살짝 흔들기</option><option value="drift">천천히 좌우 이동</option><option value="fall">천천히 위아래 이동</option></select></label>
  <div class="modalActions"><button class="btn" id="retakeBtn">다시 선택</button><button class="btn primary" id="insertBtn">작품 속에 넣기</button></div>
</div></div>

<div class="modal" id="bgModal"><div class="panel" id="settingsPanel">
  <h2>배경 설정</h2><p>미술 작품 이미지를 선택하세요. 현재 학생 작품은 그대로 유지됩니다.</p>
  <label class="choice">🖼️ 배경 이미지 선택<input id="bgInput" type="file" accept="image/*"></label>
  <label>배경 표시 방식</label>
  <div class="row"><button class="btn" id="containBtn">전체 작품 보이기</button><button class="btn" id="coverBtn">화면 가득 채우기</button></div>
  <div class="modalActions"><button class="btn danger" id="clearAllBtn">모든 학생 작품 삭제</button><button class="btn" id="closeBg">닫기</button></div>
</div></div>

<div id="toast"></div>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const stage=$('#stage'), artLayer=$('#artLayer'), emptyState=$('#emptyState'), toolbar=$('#toolbar'), editPanel=$('#editPanel');
  const addModal=$('#addModal'), processModal=$('#processModal'), bgModal=$('#bgModal');
  const originalPreview=$('#originalPreview'), processedCanvas=$('#processedCanvas'), threshold=$('#threshold'), thresholdValue=$('#thresholdValue');
  let db, currentImage=null, processedDataUrl=null, selectedId=null, manageMode=false, bgFit='contain';
  let arts=[];
  const toast=(m)=>{ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); };
  const openModal=m=>m.classList.add('show'); const closeModal=m=>m.classList.remove('show');

  function initDB(){ return new Promise((resolve,reject)=>{ const r=indexedDB.open('SketchMuseumDB',1); r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); }; r.onsuccess=e=>{db=e.target.result; resolve();}; r.onerror=reject; }); }
  function idbSet(k,v){ return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; tx.onerror=rej; }); }
  function idbGet(k){ return new Promise((res,rej)=>{ const tx=db.transaction('kv','readonly'); const r=tx.objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
  let saveQueue=Promise.resolve();
  function saveState(){ if(!db)return Promise.resolve(); const snapshot=arts.map(a=>({...a})); saveQueue=saveQueue.catch(()=>{}).then(async()=>{ await idbSet('arts',snapshot); await idbSet('bgFit',bgFit); }); return saveQueue.catch(()=>toast('저장 공간을 확인해주세요')); }

  async function restore(){
    const savedArts=await idbGet('arts'); const bg=await idbGet('bg'); const fit=await idbGet('bgFit');
    if(Array.isArray(savedArts)) arts=savedArts; if(fit) bgFit=fit; if(bg){ stage.style.backgroundImage=`url(${bg})`; stage.style.backgroundSize=bgFit; emptyState.style.display='none'; }
    arts.forEach(a=>renderArt(a,false));
  }

  async function fileToDataURL(file,max=1800,quality=.9){
    const raw=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
    const img=await loadImage(raw); const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',quality);
  }
  function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

  async function onStudentFile(file){
    if(!file) return; try{
      closeModal(addModal); toast('사진을 준비하고 있어요');
      const data=await fileToDataURL(file,1600,.92); currentImage=await loadImage(data); originalPreview.src=data; processImage(); openModal(processModal);
    } catch(e){ alert('사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해주세요.'); }
  }

  function processImage(){
    if(!currentImage)return;
    const maxSide=1400, s=Math.min(1,maxSide/Math.max(currentImage.naturalWidth,currentImage.naturalHeight));
    const w=Math.round(currentImage.naturalWidth*s), h=Math.round(currentImage.naturalHeight*s);
    const temp=document.createElement('canvas'); temp.width=w; temp.height=h; const ctx=temp.getContext('2d',{willReadFrequently:true}); ctx.drawImage(currentImage,0,0,w,h);
    const id=ctx.getImageData(0,0,w,h), d=id.data;
    // 모서리 샘플로 종이색 추정
    const samples=[]; const pad=Math.max(3,Math.floor(Math.min(w,h)*.03));
    const pts=[[pad,pad],[w-pad-1,pad],[pad,h-pad-1],[w-pad-1,h-pad-1]];
    for(const [cx,cy] of pts){ for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){ const x=Math.max(0,Math.min(w-1,cx+xx)),y=Math.max(0,Math.min(h-1,cy+yy)),i=(y*w+x)*4; samples.push([d[i],d[i+1],d[i+2]]); } }
    // 밝은 모서리 샘플만 사용해 종이의 색을 추정한다.
    const bright=samples.filter(p=>Math.min(...p)>150); const paper=bright.length>20?bright:samples;
    const bg=[0,1,2].map(ch=>paper.reduce((a,p)=>a+p[ch],0)/paper.length);
    const strength=+threshold.value; let minX=w,minY=h,maxX=-1,maxY=-1;
    for(let i=0,p=0;i<d.length;i+=4,p++){
      const r=d[i],g=d[i+1],b=d[i+2]; const dist=Math.sqrt((r-bg[0])**2+(g-bg[1])**2+(b-bg[2])**2); const brightness=(r+g+b)/3; const chroma=Math.max(r,g,b)-Math.min(r,g,b);
      const paperLike=(dist<strength && brightness>145) || (brightness>225 && chroma<42 && dist<strength*1.6);
      if(paperLike){ d[i+3]=0; }
      else if(brightness>235 && chroma<24 && dist<strength*2.0){ d[i+3]=Math.max(0,Math.round(255*(dist/(strength*2)))); }
      if(d[i+3]>28){ const x=p%w,y=Math.floor(p/w); if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y; }
    }
    ctx.putImageData(id,0,0);
    if(maxX<minX||maxY<minY){ processedDataUrl=null; processedCanvas.width=1;processedCanvas.height=1;$('#insertBtn').disabled=true;toast('그림이 보이지 않아요. 강도를 낮추거나 다시 촬영하세요');return; }
    $('#insertBtn').disabled=false;
    const margin=Math.round(Math.min(w,h)*.025); minX=Math.max(0,minX-margin); minY=Math.max(0,minY-margin); maxX=Math.min(w-1,maxX+margin); maxY=Math.min(h-1,maxY+margin);
    const cw=maxX-minX+1,ch=maxY-minY+1; const out=document.createElement('canvas'); out.width=cw; out.height=ch; out.getContext('2d').drawImage(temp,minX,minY,cw,ch,0,0,cw,ch);
    const final=document.createElement('canvas'); const scale=Math.min(1,760/Math.max(cw,ch)); final.width=Math.max(1,Math.round(cw*scale)); final.height=Math.max(1,Math.round(ch*scale)); final.getContext('2d').drawImage(out,0,0,final.width,final.height);
    processedCanvas.width=final.width; processedCanvas.height=final.height; processedCanvas.getContext('2d').clearRect(0,0,final.width,final.height); processedCanvas.getContext('2d').drawImage(final,0,0);
    processedDataUrl=final.toDataURL('image/png');
  }

  function artStyle(a,el){
    const rect=stage.getBoundingClientRect(); const w=rect.width*a.wPct/100; const h=w/a.aspect;
    el.style.left=`${a.xPct}%`; el.style.top=`${a.yPct}%`; el.style.width=`${a.wPct}%`; el.style.height=`${h}px`; el.style.transform=`translate(-50%,-50%) rotate(${a.rot}deg)`; el.style.zIndex=a.z;el.classList.remove('motion-sway','motion-drift','motion-fall');if(['sway','drift','fall'].includes(a.motion))el.classList.add('motion-'+a.motion);
  }
  function renderArt(a,animate=true){
    const el=document.createElement('div'); el.className='art'+(animate?' enter':''); el.dataset.id=a.id; const motion=document.createElement('div');motion.className='motion';const img=new Image(); img.src=a.src; motion.appendChild(img);el.appendChild(motion); artLayer.appendChild(el); artStyle(a,el); attachGestures(el,a);if(animate)setTimeout(()=>el.classList.remove('enter'),650);
  }
  function refreshArt(a){ const el=artLayer.querySelector(`[data-id="${a.id}"]`); if(el) artStyle(a,el); }
  function selectArt(id){ selectedId=id; artLayer.querySelectorAll('.art').forEach(e=>e.classList.toggle('selected',e.dataset.id===id)); editPanel.classList.toggle('show',!!id&&manageMode); const a=selected();if(a)$('#selectedMotion').value=a.motion||'fixed'; }

  function attachGestures(el,a){
    const pointers=new Map(); let start=null;
    el.addEventListener('pointerdown',e=>{ if(!manageMode)return; e.preventDefault(); el.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); selectArt(a.id); if(pointers.size===1) start={xPct:a.xPct,yPct:a.yPct,wPct:a.wPct,rot:a.rot,px:e.clientX,py:e.clientY}; else if(pointers.size===2){ const p=[...pointers.values()]; start={...start,dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),angle:Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x),wPct:a.wPct,rot:a.rot}; } });
    el.addEventListener('pointermove',e=>{ if(!manageMode||!pointers.has(e.pointerId))return; e.preventDefault(); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); const rect=stage.getBoundingClientRect(); if(pointers.size===1&&start){ const p=[...pointers.values()][0]; a.xPct=Math.max(0,Math.min(100,start.xPct+(p.x-start.px)/rect.width*100)); a.yPct=Math.max(0,Math.min(100,start.yPct+(p.y-start.py)/rect.height*100)); refreshArt(a); }
      else if(pointers.size===2&&start){ const p=[...pointers.values()]; const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), angle=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x); a.wPct=Math.max(4,Math.min(70,start.wPct*(dist/start.dist))); a.rot=start.rot+(angle-start.angle)*180/Math.PI; refreshArt(a); }
    });
    const up=e=>{ if(pointers.has(e.pointerId))pointers.delete(e.pointerId); saveState(); if(pointers.size===1){const p=[...pointers.values()][0];start={xPct:a.xPct,yPct:a.yPct,wPct:a.wPct,rot:a.rot,px:p.x,py:p.y};} };
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  }

  async function insertProcessed(){
    if(!processedDataUrl)return; const img=await loadImage(processedDataUrl); const a={id:(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),src:processedDataUrl,xPct:50,yPct:50,wPct:Math.min(24, img.naturalWidth/img.naturalHeight>2?32:22),aspect:img.naturalWidth/img.naturalHeight,rot:0,z:arts.length+1,motion:$('#newMotion').value};
    arts.push(a); renderArt(a,true); await saveState(); closeModal(processModal); currentImage=null; processedDataUrl=null; toast('작품이 추가되었어요');
  }

  async function setBackground(file){ if(!file)return; const data=await fileToDataURL(file,2200,.9); stage.style.backgroundImage=`url(${data})`; stage.style.backgroundSize=bgFit; emptyState.style.display='none'; if(db)await idbSet('bg',data); toast('배경 작품을 설정했어요'); }

  function toggleManage(){ manageMode=!manageMode; document.body.classList.toggle('editing',manageMode); $('#manageBtn').textContent=manageMode?'✅ 정리 완료':'✏️ 작품 정리'; if(!manageMode) selectArt(null); toast(manageMode?'학생 작품을 터치해서 이동·크기 조절하세요':'작품 정리를 마쳤어요'); }
  function selected(){ return arts.find(a=>a.id===selectedId); }
  editPanel.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b)return; const act=b.dataset.act, a=selected(); if(act==='done'){toggleManage();return;} if(!a)return;
    if(act==='smaller')a.wPct=Math.max(4,a.wPct*.88); if(act==='bigger')a.wPct=Math.min(75,a.wPct*1.12); if(act==='rotateL')a.rot-=10; if(act==='rotateR')a.rot+=10;
    if(act==='front'){ a.z=Math.max(...arts.map(x=>x.z),0)+1; } if(act==='back'){ a.z=Math.min(...arts.map(x=>x.z),1)-1; }
    if(act==='delete'){ if(confirm('이 학생 작품을 삭제할까요?')){ arts=arts.filter(x=>x.id!==a.id); artLayer.querySelector(`[data-id="${a.id}"]`)?.remove(); selectArt(null); } }
    refreshArt(a); saveState();
  });

  $('#selectedMotion').onchange=e=>{const a=selected();if(a){a.motion=e.target.value;refreshArt(a);saveState();}};
  $('#addBtn').onclick=()=>openModal(addModal); $('#cancelAdd').onclick=()=>closeModal(addModal); $('#cameraInput').onchange=e=>{onStudentFile(e.target.files[0]);e.target.value='';}; $('#photoInput').onchange=e=>{onStudentFile(e.target.files[0]);e.target.value='';};
  threshold.oninput=()=>{thresholdValue.textContent=threshold.value; processImage();}; $('#retakeBtn').onclick=()=>{closeModal(processModal);openModal(addModal)}; $('#insertBtn').onclick=insertProcessed;
  $('#bgBtn').onclick=()=>openModal(bgModal); $('#closeBg').onclick=()=>closeModal(bgModal); $('#bgInput').onchange=e=>{setBackground(e.target.files[0]);e.target.value='';};
  $('#containBtn').onclick=async()=>{bgFit='contain';stage.style.backgroundSize=bgFit;await saveState();}; $('#coverBtn').onclick=async()=>{bgFit='cover';stage.style.backgroundSize=bgFit;await saveState();};
  $('#clearAllBtn').onclick=()=>{ if(confirm('정말 모든 학생 작품을 삭제할까요?')){arts=[];artLayer.innerHTML='';selectArt(null);saveState();toast('모든 학생 작품을 삭제했어요');} };
  $('#manageBtn').onclick=toggleManage;
  $('#exhibitBtn').onclick=()=>{ document.body.classList.remove('editing');document.body.classList.add('exhibit'); selectArt(null); manageMode=false;$('#manageBtn').textContent='✏️ 작품 정리'; };
  $('#exitExhibit').onclick=()=>document.body.classList.remove('exhibit');
  stage.addEventListener('dblclick',()=>{ if(document.body.classList.contains('exhibit'))document.body.classList.remove('exhibit'); });
  window.addEventListener('resize',()=>arts.forEach(refreshArt));
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')saveState(); });
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  initDB().then(restore).catch(()=>toast('저장 기능을 시작하지 못했어요'));
})();
</script>
</body>
</html>
